name: Hotel Booking Portal CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One CI run per branch or PR at a time: a new push supersedes the previous
# one and cancels the outdated run instead of queueing it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend - Java 21 and MySQL 8.4
    runs-on: ubuntu-latest
    # Bounded runtime: MySQL service boot plus the full Maven verify stays
    # well inside this ceiling; the limit exists so a hang fails loudly.
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: hotel_booking
          MYSQL_USER: hotel_app
          MYSQL_PASSWORD: ci-test-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests
        env:
          SPRING_PROFILES_ACTIVE: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: hotel_booking
          DB_USERNAME: hotel_app
          DB_PASSWORD: ci-test-password
        run: chmod +x ./mvnw && ./mvnw -B -ntp clean verify

      # Test evidence for every run: Surefire XML reports upload after
      # successful and failed test runs alike (if: always()). A run that
      # fails before the test phase produces no reports, and
      # if-no-files-found: ignore keeps that from failing the upload step.
      - name: Upload Surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

      # Informational only - lists newer dependency and parent versions on
      # Maven Central. Nothing is upgraded here: the Boot BOM stays the
      # single version authority and Dependabot proposes any real change.
      # continue-on-error is scoped to this report step alone, so a Maven
      # Central, network or plugin failure cannot turn an otherwise
      # successful backend verification into a failed job. The blocking
      # backend check is the ./mvnw -B -ntp clean verify step above;
      # continue-on-error is never applied to tests or essential checks.
      - name: Report available Maven dependency updates (informational, non-blocking)
        continue-on-error: true
        run: |
          ./mvnw -B -ntp \
            org.codehaus.mojo:versions-maven-plugin:2.25.1:display-dependency-updates \
            org.codehaus.mojo:versions-maven-plugin:2.25.1:display-parent-updates

  frontend:
    name: Frontend - TypeScript and Vite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Production dependencies only, decided by npm audit's own exit
      # status (no --fix, no masking). The report lands in the job log and
      # the run summary; pipefail keeps the audit exit code through the tee.
      - name: Audit production dependencies
        run: |
          set -o pipefail
          npm audit --omit=dev 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build frontend
        run: npm run build
