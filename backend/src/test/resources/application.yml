# Test datasource: in-memory H2 in MySQL compatibility mode, so the same
# migration files are exercised without touching the file database behind
# the running app. Launch with SPRING_PROFILES_ACTIVE=mysql to run this
# suite against real MySQL instead (see docs/DATABASE.md).
spring:
  datasource:
    url: jdbc:h2:mem:hotelbooking-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
