# Shared test configuration.
#
# This file must be SELF-SUFFICIENT: on the test classpath it can shadow the
# main tree's application.yml entirely (first classpath resource wins), so
# every property the full application context needs - the business timezone
# and CORS allowlist beans included - is restated here rather than assumed
# from src/main/resources. The datasource is deliberately NOT in this file:
# it lives in the profile files beside it, because profile-specific files
# outrank plain ones and the plain declaration would lose that battle - see
# docs/TESTING.md for the full precedence story.
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  # BusinessTimeConfig and CorsConfig resolve these with no defaults; a
  # missing key is a context startup failure, not a warning.
  business-timezone: Asia/Kolkata
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
