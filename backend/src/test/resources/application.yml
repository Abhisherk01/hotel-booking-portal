# Shared test configuration.
#
# This file must be SELF-SUFFICIENT: on the test classpath it can shadow the
# main tree's application.yml entirely (first classpath resource wins), so
# every property the full application context needs - the business timezone
# and CORS allowlist beans included - is restated here rather than assumed
# from src/main/resources. The datasource is deliberately NOT in this file:
# it lives in the profile files beside it, because profile-specific files
# outrank plain ones and the plain declaration would lose that battle - see
# docs/TESTING.md for the full precedence story.
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  # BusinessTimeConfig and CorsConfig resolve these with no defaults; a
  # missing key is a context startup failure, not a warning.
  business-timezone: Asia/Kolkata
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  rate-limit:
    # The suite hits the booking endpoints far more densely than any guest:
    # the contract tests create a booking in most tests and the two
    # concurrency races add more, all from the same client address inside
    # one fixed window. The test ceilings therefore only keep the filter
    # active (real code path, real registration order) without throttling
    # the suite; the actual limit behaviour is pinned by RateLimitFilterTest,
    # which drives the filter directly with tiny budgets and a mutable clock.
    enabled: true
    window-seconds: 60
    max-booking-create: 100000
    max-lookup: 100000
    max-cancel: 100000
    max-quote: 100000
