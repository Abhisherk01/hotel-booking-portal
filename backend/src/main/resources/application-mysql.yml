# MySQL 8 profile for local/staging runs. All credentials come from the
# environment (see .env.example) - nothing is defaulted to a real password.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hotel_booking}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:hotel_app}
    password: ${DB_PASSWORD:}
  h2:
    console:
      enabled: false
