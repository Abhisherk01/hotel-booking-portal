# Default profile - H2 in MySQL compatibility mode, persisted to ./data/.
# Used for local development without a MySQL server. The schema, migrations
# and locking behaviour stay identical to the MySQL profile.
spring:
  datasource:
    url: jdbc:h2:file:./data/hotelbooking;MODE=MySQL
    driver-class-name: org.h2.Driver
    # Local dev only; no secrets live in this file and none of this data is sensitive.
    username: sa
    password: ""
  h2:
    console:
      # Development convenience, never a production feature. Off by default
      # since the Phase 4 hardening: a deploy that forgets its profile gets
      # no /h2-console. Opt in explicitly for local debugging by setting
      # H2_CONSOLE_ENABLED=true (see .env.example) - the same variable the
      # shell passes through to this file.
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
