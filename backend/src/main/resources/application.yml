spring:
  application:
    name: hotel-booking-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

server:
  port: ${SERVER_PORT:8080}
  error:
    # A curated error envelope takes over in the exception-handling phase.
    # Until then, Spring's default error payload stays stripped of internals -
    # no messages, no exception classes, no stack traces.
    include-stacktrace: never
    include-exception: false
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never

app:
  business-timezone: Asia/Kolkata
  cors:
    # 3000: classic React setups; 5173: Vite's dev server. Override with
    # CORS_ALLOWED_ORIGINS when deploying behind a real origin.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  rate-limit:
    # Single-instance, fixed-window throttle on the booking endpoints - a
    # defense-in-depth backstop, NOT the production authority. A real
    # deployment sits behind a gateway (nginx/Cloudflare/LB) that owns rate
    # limiting; set APP_RATE_LIMIT_ENABLED=false there, because every client
    # then shares the gateway's one source address. Policy values live here
    # (not in code) so a deployment can tune them without a rebuild.
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    window-seconds: 60
    max-booking-create: 10
    max-lookup: 10
    max-cancel: 10
    max-quote: 30
